# Builds KERF for Windows and macOS on GitHub's machines, checks the Audio Unit (auval) and
# keeps the finished plugins and installers as downloads ("Artifacts" on the run's page).
#
#   push to main / pull request / "Run workflow" button -> build + test
#   push a tag like v0.9.1                              -> also publishes a GitHub Release
#
# Downloads per system: an installer (Windows: KERF-...-Windows-Setup.exe, macOS:
# KERF-...-macOS-Installer.pkg) and a zip with the plain files.
#
# macOS signing + notarisation runs only when the Apple secrets exist (MACOS_CERTIFICATE,
# MACOS_CERTIFICATE_PASSWORD, MACOS_SIGNING_IDENTITY, APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD,
# optionally MACOS_INSTALLER_IDENTITY for the .pkg).
# Compiler errors are also written as annotations (readable on the run's page and through
# the API without signing in).

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      stage: ${{ steps.read.outputs.stage }}
      label: ${{ steps.read.outputs.label }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        name: Read the version from CMakeLists.txt
        run: |
          version=$(grep -oP 'project\(KERF VERSION \K[0-9.]+' CMakeLists.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A pre-release word after the number (KERF_VERSION_LABEL "... beta"), or nothing.
          stage=$(grep -oP 'set\(KERF_VERSION_LABEL "\$\{PROJECT_VERSION\} \K[a-z]+' CMakeLists.txt || true)
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "label=$version${stage:+ $stage}" >> "$GITHUB_OUTPUT"
          echo "KERF $version $stage"
      - name: The tag must match it
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.read.outputs.version }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} but CMakeLists.txt says ${{ steps.read.outputs.version }}"
            exit 1
          fi

  windows:
    name: Windows
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
      LABEL: ${{ needs.version.outputs.label }}
    steps:
      - uses: actions/checkout@v4

      # The newest Visual Studio on the machine (the "windows" preset pins VS 2022 for local use).
      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel --target Kerf_VST3 Kerf_Standalone *> build.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path build.log -Pattern ": (fatal )?error " | Select-Object -First 30 | ForEach-Object { "::error::$($_.Line.Trim())" }
            Get-Content build.log -Tail 60
            exit 1
          }

      - name: Package (zip and installer)
        shell: pwsh
        run: |
          $name = "KERF-$env:VERSION-Windows"
          $stage = "dist\$name"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item -Recurse build\Kerf_artefacts\Release\VST3\KERF.vst3 $stage
          Copy-Item build\Kerf_artefacts\Release\Standalone\KERF.exe $stage
          @"
          KERF $env:LABEL for Windows (64-bit)

          Easiest: run KERF-$env:VERSION-Windows-Setup.exe (from the same release page) instead.

          By hand:
            Plugin:     copy KERF.vst3 into C:\Program Files\Common Files\VST3
                        then in FL Studio: Options > Manage plugins > Find installed plugins.
            Standalone: KERF.exe runs without a DAW.
          "@ | Set-Content -Encoding utf8 "$stage\README.txt"
          Compress-Archive -Path $stage -DestinationPath "dist\$name.zip"

          # The installer (Inno Setup; installed here if this machine has none).
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$env:VERSION" "/DAppLabel=$env:LABEL" "/DSourceDir=$PWD\$stage" "/DOutputDir=$PWD\dist" installer\windows\KERF.iss
          if ($LASTEXITCODE -ne 0) { "::error::The installer could not be built (Inno Setup)"; exit 1 }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: KERF-${{ env.VERSION }}-Windows
          path: |
            dist/KERF-${{ env.VERSION }}-Windows.zip
            dist/KERF-${{ env.VERSION }}-Windows-Setup.exe
          if-no-files-found: error

  macos:
    name: macOS
    needs: version
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
      LABEL: ${{ needs.version.outputs.label }}
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_APP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure (universal, macOS 11+)
        run: cmake --preset mac

      - name: Build
        run: |
          if ! cmake --build build-mac --config Release --target Kerf_VST3 Kerf_AU Kerf_Standalone -- -quiet > build.log 2>&1; then
            grep -E "(error|fatal error): " build.log | sort -u | head -30 | while IFS= read -r line; do echo "::error::$line"; done
            tail -n 60 build.log
            exit 1
          fi

      - name: Validate the Audio Unit (auval, what Logic runs)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          ditto build-mac/Kerf_artefacts/Release/AU/KERF.component ~/Library/Audio/Plug-Ins/Components/KERF.component
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          for i in 1 2 3 4 5; do auval -a | grep -q Krf1 && break; sleep 3; done
          auval -v aumu Krf1 Kerf

      - name: Import the signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/kerf.keychain-db"
          pass=$(uuidgen)
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pass" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Sign and notarise
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash scripts/sign-mac.sh build-mac/Kerf_artefacts/Release

      - name: Package (zip and installer)
        env:
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
        run: |
          name="KERF-$VERSION-macOS"
          stage="dist/$name"
          mkdir -p "$stage"
          ditto build-mac/Kerf_artefacts/Release/VST3/KERF.vst3 "$stage/KERF.vst3"
          ditto build-mac/Kerf_artefacts/Release/AU/KERF.component "$stage/KERF.component"
          ditto build-mac/Kerf_artefacts/Release/Standalone/KERF.app "$stage/KERF.app"
          cp scripts/install-mac.sh "$stage/install.sh"
          if [ "$HAS_SIGNING" = "true" ]; then signed="signed and notarised"; else signed="NOT signed (beta)"; fi
          cat > "$stage/README.txt" <<EOF
          KERF $LABEL for macOS 11+ (Apple Silicon and Intel), $signed.

          Easiest: open KERF-$VERSION-macOS-Installer.pkg (from the same release page) instead.

          By hand: open Terminal, type "bash " (with the space), drag install.sh into the window, Enter.
          It copies KERF into your plugin folders:
            KERF.vst3       -> ~/Library/Audio/Plug-Ins/VST3
            KERF.component  -> ~/Library/Audio/Plug-Ins/Components   (Logic, GarageBand)
            KERF.app        -> ~/Applications                         (runs without a DAW)
          EOF
          ditto -c -k --keepParent "$stage" "dist/$name.zip"

          bash scripts/package-mac-pkg.sh build-mac/Kerf_artefacts/Release "$VERSION" "$LABEL" dist
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: KERF-${{ env.VERSION }}-macOS
          path: |
            dist/KERF-${{ env.VERSION }}-macOS.zip
            dist/KERF-${{ env.VERSION }}-macOS-Installer.pkg
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release (KERF's "Check for updates" reads it)
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE: ${{ needs.version.outputs.stage }}
        run: |
          # A beta is published as a pre-release ("KERF 0.9.1 beta").
          extra=()
          if [ -n "$STAGE" ]; then extra=(--prerelease); fi
          ls -la dist
          # The tag pushed again (the same version rebuilt): replace the release's files.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "KERF ${{ needs.version.outputs.label }}" \
            --generate-notes "${extra[@]}"
